name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-stub:
    name: Release Stub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - uses: Swatinem/rust-cache@v2

      - name: Build release artifacts
        run: cargo build --workspace --release
